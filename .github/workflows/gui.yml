name: GUI reproduction

on:
  push:
    paths:
      - 'src/uav_detection/gui/**'
      - 'scripts/**'
      - 'tests/test_gui*.py'
      - 'configs/**'
      - 'constraints/**'
      - 'pyproject.toml'
      - 'docs/GUI*.md'
      - '.github/workflows/gui.yml'
  pull_request:
    paths:
      - 'src/uav_detection/gui/**'
      - 'scripts/**'
      - 'tests/test_gui*.py'
      - 'configs/**'
      - 'constraints/**'
      - 'pyproject.toml'
      - 'docs/GUI*.md'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/gui-desktop-20261116.txt
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install the recorded GUI dependencies
        run: python -m pip install -e '.[gui]' -c constraints/gui-desktop-20261116.txt
      - name: Check GUI contracts and generated replay
        run: python scripts/check_gui.py
      - name: Check repository documents
        run: |
          python scripts/check_repository.py
          python scripts/check_references.py
