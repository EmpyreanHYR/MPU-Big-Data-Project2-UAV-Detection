[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpu-uav-detection"
version = "0.1.0"
description = "YOLO26 infrared UAV detection course project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["ultralytics==8.4.193"]
data = ["pillow>=10,<14"]
evaluation = ["numpy>=1.26,<3", "pillow>=10,<14"]
edge = ["numpy>=1.26,<3", "pillow>=10,<14", "onnxruntime==1.23.2"]
gui = [
    "PyQt6==6.12.1; sys_platform == 'darwin'",
    "PyQt6-Qt6==6.12.0; sys_platform == 'darwin'",
    "PyQt6>=6.8,<7; sys_platform != 'darwin'",
    "numpy>=1.26,<3", "pillow>=10,<14", "opencv-python-headless>=4.10,<5",
]

[project.scripts]
uav-demo = "uav_detection.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
